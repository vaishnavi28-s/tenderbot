router_settings:
  routing_strategy: simple-shuffle
  num_retries: 4
  cooldown_time: 0
  disable_cooldowns: True
  enable_pre_call_check: true
  set_verbose: true
general_settings:
  master_key: sk-1234
litellm_settings:
  request_timeout: 20